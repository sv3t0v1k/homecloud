# Gitleaks конфигурация HomeCloud.
#
# База — встроенные правила gitleaks; добавлены только точечные исключения.
# Политика исключений (Security Policy v2): без широких waiver'ов — каждое
# исключение обязано сужать и путь, и образец одновременно.

[extend]
useDefault = true

# Синтетические маркеры failure-security runtime-теста: фикстура намеренно
# вводит строки вида smoke-*-938475 и проверяет, что они НЕ попадают в логи.
# Это не секреты; находки по ним недетерминированы между прогонами
# (2026-11-17: run 44088429392 attempts 2/3, fingerprint 17c4d14f...:120).
# Исключение сужено до одного тестового файла и семейства маркеров.
[allowlist]
paths = ['''scripts/tests/failure-security-runtime\.py''']
regexes = ['''smoke-[a-z-]*938475[a-z0-9!]*''', '''FailurePassword938475!''']
