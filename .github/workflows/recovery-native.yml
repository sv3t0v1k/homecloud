name: HomeCloud Native Recovery Qualification

on:
  workflow_call:
    inputs:
      source_sha:
        type: string
        required: true

permissions:
  contents: read

jobs:
  native-recovery:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Verify trusted PR source before checkout
        shell: bash
        env:
          CALLER_EVENT_NAME: ${{ github.event_name }}
          CALLER_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CALLER_BASE_REPOSITORY: ${{ github.event.pull_request.base.repo.full_name }}
          EXPECTED_REPOSITORY: ${{ github.repository }}
          REQUESTED_SOURCE_SHA: ${{ inputs.source_sha }}
        run: |
          set -euo pipefail
          test "$CALLER_EVENT_NAME" = pull_request || exit 1
          test "${#CALLER_HEAD_SHA}" -eq 40 || exit 1
          case "$CALLER_HEAD_SHA" in
            *[!0123456789abcdef]*) exit 1 ;;
          esac
          test "${#REQUESTED_SOURCE_SHA}" -eq 40 || exit 1
          case "$REQUESTED_SOURCE_SHA" in
            *[!0123456789abcdef]*) exit 1 ;;
          esac
          test "$REQUESTED_SOURCE_SHA" = "$CALLER_HEAD_SHA" || exit 1
          test -n "$EXPECTED_REPOSITORY" || exit 1
          test "$CALLER_BASE_REPOSITORY" = "$EXPECTED_REPOSITORY" || exit 1
          echo "PASS: recovery source bound to the PR event"
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact checkout before candidate code
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "${#EXPECTED_SOURCE_SHA}" -eq 40 || exit 1
          case "$EXPECTED_SOURCE_SHA" in
            *[!0123456789abcdef]*) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA" || exit 1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24.21.0'
      - name: Upgrade global npm from the verified archive before workload
        run: python3 scripts/ci/install-npm.py
      - id: bases
        run: |
          python3 -c 'import json,os; d=json.load(open("scripts/ci/images.lock.json")); f=open(os.environ["GITHUB_OUTPUT"],"a"); [f.write(k+"="+v+"\n") for k,v in d.items()]'
      - id: source
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          test "${#EXPECTED_SOURCE_SHA}" -eq 40 || exit 1
          case "$EXPECTED_SOURCE_SHA" in
            *[!0123456789abcdef]*) exit 1 ;;
          esac
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA" || exit 1
          git diff --quiet HEAD -- . ':(exclude)scripts/tests/PHASE-5.3.1-TEST-AUDIT.md'
          test -z "$(git ls-files --others --exclude-standard -- backend frontend)"
          echo "commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "repository=${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@e468171a9de216ec08956ac3ada2f0791b6bd435 # v3.11.1
        with:
          version: v0.38.0
          driver-opts: image=moby/buildkit@sha256:98cc6a3fc46220d00f8224ae483f3274fc874e9be8d7dd1e2e2c5481209228b5
      - name: Verify exact backend context before build
        id: context
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 -B scripts/ci/verify-recovery-context.py \
            --commit "$EXPECTED_SOURCE_SHA" \
            --output backend.context.binding.json
          test -s backend.context.binding.json || exit 1
      - name: Build offline OCI provenance candidate
        id: offline
        uses: docker/build-push-action@263435318d21b8e681c14492fe198d362a7d2c83 # v6.18.0
        env:
          BUILDX_GIT_CHECK_DIRTY: 'false'
          BUILDX_GIT_INFO: 'true'
          BUILDX_GIT_LABELS: 'false'
        with:
          context: ./backend
          platforms: linux/amd64
          push: false
          load: false
          outputs: type=oci,dest=${{ runner.temp }}/backend.oci.tar
          provenance: mode=max,version=v0.2
          tags: ghcr.io/${{ steps.source.outputs.repository }}/backend:dry-run
          labels: |
            org.opencontainers.image.source=https://github.com/${{ steps.source.outputs.repository }}
            org.opencontainers.image.revision=${{ steps.source.outputs.commit }}
            org.opencontainers.image.version=dry-run
            io.homecloud.role=backend
            io.homecloud.pair=${{ steps.source.outputs.commit }}
          build-args: |
            NODE_IMAGE=${{ steps.bases.outputs.node }}
            NGINX_IMAGE=${{ steps.bases.outputs.nginx }}
      - name: Verify offline OCI digest, source and attestation
        env:
          BUILD_METADATA: ${{ steps.offline.outputs.metadata }}
          SOURCE_COMMIT: ${{ steps.source.outputs.commit }}
          REPOSITORY: ${{ steps.source.outputs.repository }}
        run: |
          python3 -c 'import os; open("offline-backend-metadata.json", "w").write(os.environ["BUILD_METADATA"])'
          python3 scripts/ci/provenance.py dry-run --archive "$RUNNER_TEMP/backend.oci.tar" --metadata "offline-backend-metadata.json" --component "backend" --version "dry-run" --commit "$SOURCE_COMMIT" --repository "$REPOSITORY" --output "offline-backend.json"
      - name: Load the exact OCI candidate for runtime smoke
        id: runtime
        run: |
          uname -a
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          docker info --format '{"os":{{json .OSType}},"arch":{{json .Architecture}},"operating_system":{{json .OperatingSystem}},"version":{{json .ServerVersion}}}' > "backend.native-host.json"
          python3 - <<'PY'
          import json
          from pathlib import Path
          host = json.loads(Path('backend.native-host.json').read_text())
          assert host['os'] == 'linux' and host['arch'] in ('x86_64', 'amd64')
          assert 'desktop' not in host['operating_system'].lower()
          print('NATIVE_AMD64_HOST:', json.dumps(host, sort_keys=True))
          PY
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo copy --override-os linux --override-arch amd64 "oci-archive:$RUNNER_TEMP/backend.oci.tar" "docker-daemon:homecloud-ci-backend:${{ steps.source.outputs.commit }}"
          docker image inspect "homecloud-ci-backend:${{ steps.source.outputs.commit }}" > "backend.loaded.inspect.json"
          python3 scripts/ci/oci-scan-binding.py --archive "$RUNNER_TEMP/backend.oci.tar" --loaded-inspect "backend.loaded.inspect.json" --role "backend" --source "$(git rev-parse HEAD)" --output "backend.loaded.binding.json"
      - name: Bind all runtime tests to verified OCI image ID
        id: image
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          proof = json.loads(
              Path("backend.loaded.binding.json").read_bytes()
          )
          expected = os.environ["EXPECTED_SOURCE_SHA"]
          image_id = proof.get("config_digest")

          if (
              proof.get("role") != "backend"
              or proof.get("source_commit") != expected
              or not re.fullmatch("[a-f0-9]{40}", expected)
              or proof.get("binding") != "LOADED_EXACT_OCI_CONFIG_AND_FILESYSTEM"
              or not isinstance(image_id, str)
              or not re.fullmatch("sha256:[a-f0-9]{64}", image_id)
          ):
              raise SystemExit("BLOCKED: invalid OCI runtime binding")

          observed = subprocess.check_output(
              [
                  "docker", "image", "inspect",
                  "--format", "{{.Id}} {{.Os}}/{{.Architecture}}",
                  image_id,
              ],
              text=True,
              timeout=30,
          ).strip()

          if observed != image_id + " linux/amd64":
              raise SystemExit("BLOCKED: loaded runtime identity mismatch")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("image_id=" + image_id + "\n")

          print("PASS: runtime image bound to verified OCI config ID", image_id)
          PY
      - name: Backend production image native dependencies, without mounts or startup
        env:
          IMAGE: ${{ steps.image.outputs.image_id }}
        run: |
          docker run --rm --pull=never --network none --read-only --cap-drop ALL --security-opt no-new-privileges --entrypoint node "$IMAGE" -e '
          const assert=require("node:assert/strict");
          const fs=require("node:fs");
          const {spawnSync}=require("node:child_process");
          const sharp=require("sharp");
          assert.equal(process.getuid(),1001);
          assert.equal(process.version,"v24.21.0");
          for(const path of ["/usr/local/lib/node_modules/npm","/usr/local/bin/npm","/usr/local/bin/npx"]){assert.equal(fs.existsSync(path),false);}
          for(const path of ["/storage","/storage/.tmp"]){const stat=fs.statSync(path);assert.equal(stat.uid,1001);assert.equal(stat.mode & 0o777,0o700);}
          const cli=spawnSync(process.execPath,["./node_modules/typeorm/cli.js","migration:run","--help"],{encoding:"utf8",timeout:10000});
          assert.ifError(cli.error);assert.equal(cli.status,0);assert.match(cli.stdout,/transaction/);
          assert.equal(sharp.versions.sharp,"0.35.5");
          require("./native/secure-fs.node");
          sharp({create:{width:20,height:10,channels:3,background:"#336699"}}).jpeg().toBuffer()
          .then(input=>sharp(input).resize(10,10,{fit:"inside"}).png().toBuffer())
          .then(output=>sharp(output).metadata())
          .then(meta=>{assert.equal(meta.width,10);assert.equal(meta.height,5);console.log("PASS: linux/amd64 musl native addon and image decoder");})
          .catch(error=>{console.error(error.message);process.exitCode=1;});'
      - name: Real copy recovery and maintenance admission on the production image
        env:
          IMAGE: ${{ steps.image.outputs.image_id }}
        run: |
          docker run --rm --pull=never --platform linux/amd64 --network none --cap-drop ALL --security-opt no-new-privileges --entrypoint node "$IMAGE" -e "$(cat scripts/ci/native-boundary-preflight.cjs)" -- --strict
          bash scripts/ci/test-maintenance-supervisor.sh "$IMAGE" linux/amd64
          bash scripts/ci/test-copy-recovery-e2e.sh "$IMAGE" linux/amd64
      - name: Verify runtime image architecture
        env:
          IMAGE: ${{ steps.image.outputs.image_id }}
        run: |
          test "$(docker image inspect "$IMAGE" --format '{{.Id}}')" = "$IMAGE" || exit 1
          test "$(docker image inspect "$IMAGE" --format '{{.Os}}/{{.Architecture}}')" = linux/amd64 || exit 1
      - name: Verify recovery evidence files
        shell: bash
        run: |
          for file in \
            backend.context.binding.json \
            offline-backend.json \
            offline-backend-metadata.json \
            backend.native-host.json \
            backend.loaded.inspect.json \
            backend.loaded.binding.json
          do
            test -s "$file"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-recovery-evidence-${{ github.run_attempt }}
          path: |
            backend.context.binding.json
            offline-backend.json
            offline-backend-metadata.json
            backend.native-host.json
            backend.loaded.inspect.json
            backend.loaded.binding.json
          if-no-files-found: error
          retention-days: 14
      - name: Retain the exact verified OCI for parallel scenarios
        id: candidate-archive
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-recovery-backend-oci-${{ github.run_attempt }}
          path: ${{ runner.temp }}/backend.oci.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 7

  native-recovery-scenarios:
    needs: native-recovery
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        scenario:
          - plain
          - encrypted
          - historical
          - partial-stop
          - staged
          - db-restored
          - reconciled
          - ready-before-clear
          - ready-after-clear
          - foreign-writer
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          repository: ${{ github.repository }}
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Verify exact scenario checkout
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          test "$EXPECTED_SOURCE_SHA" = '${{ inputs.source_sha }}'
          test "$(git rev-parse HEAD)" = "$EXPECTED_SOURCE_SHA"
      - name: Download the exact qualified OCI candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: native-recovery-backend-oci-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-recovery-candidate
      - name: Load the retained OCI for one isolated scenario
        id: runtime
        shell: bash
        run: |
          set -euo pipefail
          uname -a
          test "$(uname -s)/$(uname -m)" = Linux/x86_64
          docker info --format '{"os":{{json .OSType}},"arch":{{json .Architecture}},"operating_system":{{json .OperatingSystem}},"version":{{json .ServerVersion}}}' > backend.native-host.json
          python3 - <<'PY'
          import json
          from pathlib import Path
          host = json.loads(Path('backend.native-host.json').read_text())
          assert host['os'] == 'linux' and host['arch'] in ('x86_64', 'amd64')
          assert 'desktop' not in host['operating_system'].lower()
          print('NATIVE_AMD64_HOST:', json.dumps(host, sort_keys=True))
          PY
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends skopeo
          skopeo copy --override-os linux --override-arch amd64 "oci-archive:$RUNNER_TEMP/native-recovery-candidate/backend.oci.tar" "docker-daemon:homecloud-ci-backend:${{ inputs.source_sha }}"
          docker image inspect "homecloud-ci-backend:${{ inputs.source_sha }}" > backend.loaded.inspect.json
          python3 scripts/ci/oci-scan-binding.py --archive "$RUNNER_TEMP/native-recovery-candidate/backend.oci.tar" --loaded-inspect backend.loaded.inspect.json --role backend --source "$(git rev-parse HEAD)" --output backend.loaded.binding.json
      - name: Bind this scenario to the verified OCI image ID
        id: image
        shell: bash
        env:
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          import re
          import subprocess

          proof = json.loads(
              Path("backend.loaded.binding.json").read_bytes()
          )
          expected = os.environ["EXPECTED_SOURCE_SHA"]
          image_id = proof.get("config_digest")

          if (
              proof.get("role") != "backend"
              or proof.get("source_commit") != expected
              or not re.fullmatch("[a-f0-9]{40}", expected)
              or proof.get("binding") != "LOADED_EXACT_OCI_CONFIG_AND_FILESYSTEM"
              or not isinstance(image_id, str)
              or not re.fullmatch("sha256:[a-f0-9]{64}", image_id)
          ):
              raise SystemExit("BLOCKED: invalid OCI runtime binding")

          observed = subprocess.check_output(
              [
                  "docker", "image", "inspect",
                  "--format", "{{.Id}} {{.Os}}/{{.Architecture}}",
                  image_id,
              ],
              text=True,
              timeout=30,
          ).strip()

          if observed != image_id + " linux/amd64":
              raise SystemExit("BLOCKED: loaded runtime identity mismatch")

          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              output.write("image_id=" + image_id + "\n")

          print("PASS: runtime image bound to verified OCI config ID", image_id)
          PY
      - name: Run one fresh isolated Backup Restore scenario
        id: scenario
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
          HOMECLOUD_E2E_BACKEND_IMAGE: ${{ steps.image.outputs.image_id }}
          HOMECLOUD_E2E_BACKEND_IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: |
          set -euo pipefail
          options=()
          case "$SCENARIO" in
            plain) ;;
            encrypted) options=(--encrypted-only) ;;
            historical) options=(--historical-schema-only) ;;
            partial-stop|staged|db-restored|reconciled|ready-before-clear|ready-after-clear|foreign-writer)
              options=("--fault-case=$SCENARIO")
              ;;
            *)
              echo "BLOCKED: unknown Native Recovery scenario" >&2
              exit 1
              ;;
          esac
          pg_image=$(python3 -c 'import json; print(json.load(open("scripts/ci/production-images.lock.json"))["postgres"])')
          stub_image=$(python3 -c 'import json; print(json.load(open("scripts/ci/images.lock.json"))["node"])')
          docker pull --platform linux/amd64 "$pg_image"
          docker tag "$pg_image" postgres:16-alpine
          docker pull --platform linux/amd64 "$stub_image"
          HOMECLOUD_E2E_STUB_IMAGE="$stub_image" bash scripts/ci/run-restore-e2e-local.sh linux/amd64 "${options[@]}"
      - name: Record the completed scenario identity
        shell: bash
        env:
          SCENARIO: ${{ matrix.scenario }}
          EXPECTED_SOURCE_SHA: ${{ github.event.pull_request.head.sha }}
          IMAGE_ID: ${{ steps.image.outputs.image_id }}
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          result = {
              'scenario': os.environ['SCENARIO'],
              'source_commit': os.environ['EXPECTED_SOURCE_SHA'],
              'image_id': os.environ['IMAGE_ID'],
              'status': 'passed',
          }
          Path('native-recovery-' + result['scenario'] + '.json').write_text(
              json.dumps(result, sort_keys=True) + '\n'
          )
          PY
      - name: Retain evidence for this exact scenario
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: native-recovery-scenario-${{ matrix.scenario }}-${{ github.run_attempt }}
          path: |
            native-recovery-${{ matrix.scenario }}.json
            backend.native-host.json
            backend.loaded.inspect.json
            backend.loaded.binding.json
          if-no-files-found: error
          retention-days: 14

  native-recovery-gate:
    if: always()
    needs: [native-recovery, native-recovery-scenarios]
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    steps:
      - name: Require the shared candidate and every recovery scenario
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          python3 - <<'PY'
          import json
          import os
          results = json.loads(os.environ['RESULTS'])
          expected = {'native-recovery', 'native-recovery-scenarios'}
          assert set(results) == expected, results
          for name, result in results.items():
              assert result.get('result') == 'success', (name, result)
          print('PASS: shared OCI candidate and all 10 Native Recovery scenarios')
          PY
